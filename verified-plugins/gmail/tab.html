<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/__deskmate/ui.css">
<link rel="stylesheet" href="tab.css">
</head>
<body class="page">
  <!-- Signed out -->
  <div id="signin" class="signin hidden">
    <div class="g-title">Gmail</div>
    <p class="muted small">See new emails and grab sign-in codes without opening your inbox.</p>
    <button id="connectBtn" class="google"><span class="g-logo">G</span>Sign in with Google</button>
    <p class="muted small">You sign in on Google's own page in your browser. DeskMate never sees your password, and this plugin can only read mail, never send or delete it.</p>
    <div id="signinErr" class="err"></div>
  </div>

  <!-- Signed in -->
  <div id="mail" class="hidden col">
    <div class="row">
      <span id="account" class="muted small ellipsis grow"></span>
      <button id="refreshBtn" class="ghost">Refresh</button>
      <button id="signoutBtn" class="ghost" title="Sign out">Sign out</button>
    </div>
    <div id="codes" class="codes"></div>
    <div id="summary" class="muted small"></div>
    <div id="list" class="list"></div>
  </div>
  <script src="tab.js"></script>
</body>
</html>
