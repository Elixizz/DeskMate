<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/__deskmate/ui.css">
<link rel="stylesheet" href="tab.css">
</head>
<body class="page">
  <div class="row">
    <select id="range">
      <option value="seen">Since last checked</option>
      <option value="24h">Last 24 hours</option>
      <option value="7d">Last 7 days</option>
    </select>
    <button id="refreshBtn" class="ghost">Refresh</button>
    <button id="seenBtn">Mark seen</button>
  </div>
  <div id="watchBar" class="watchbar hidden">
    <span class="dots" id="watchDots"><i></i><i></i><i></i></span>
    <span id="watchText" class="ellipsis grow"></span>
    <button id="unwatchBtn" class="chip">Stop</button>
  </div>
  <div id="replyBox" class="replybox hidden">
    <div class="row">
      <input id="replyInput" class="grow" placeholder="Reply to Claude..." autocomplete="off">
      <button id="replyBtn">Send</button>
    </div>
    <div id="replyOut" class="replyout hidden"></div>
  </div>
  <div id="claudeSummary" class="muted small"></div>
  <div id="claudeList" class="list"></div>
  <script src="tab.js"></script>
</body>
</html>
