<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/__deskmate/ui.css">
<style>
  body { background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  body > * { flex: none; }
  #npTitle { font-size: 12px; }
  #seek { width: 100%; }
  #vol { flex: 1; margin-left: 8px; }
</style>
</head>
<body>
  <div id="npTitle" class="ellipsis">Nothing playing</div>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="controls">
    <button id="prevBtn" class="icon">&#x23EE;</button>
    <button id="playBtn" class="icon play">&#x25B6;</button>
    <button id="nextBtn" class="icon">&#x23ED;</button>
    <button id="shuffleBtn" class="icon" title="Shuffle">&#x1F500;</button>
    <input id="vol" type="range" min="0" max="1" step="0.01">
  </div>
  <script src="bar.js"></script>
</body>
</html>
